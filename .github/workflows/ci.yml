name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  rust:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PROTOC: /opt/homebrew/bin/protoc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        run: brew install protobuf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Install cargo-audit
        run: |
          rustup update stable
          cargo install cargo-audit --force

      - name: Security audit (cargo-audit)
        # The deployed lockfile already carries a separately tracked advisory
        # backlog. Keep every branch scan visible without making that baseline
        # debt masquerade as an rmcp/CI regression.
        continue-on-error: true
        run: cargo audit

  db-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_DB_TESTS: "1"
      REEMBED_TEST_CONFIRM_DISPOSABLE_NS: "1"
      SURR_DB_URL: ws://127.0.0.1:8000
      SURR_DB_USER: root
      SURR_DB_PASS: root
      SURR_DB_NS: surreal_mind_ci
      SURR_DB_DB: ci
      # These tests construct the provider clients and tool schemas but never
      # call an external model API. A non-secret placeholder is intentional.
      OPENAI_API_KEY: ci-not-used
      ANTHROPIC_MODELS: claude-sonnet-5
      ANTHROPIC_MODEL: claude-sonnet-5
      MCP_NO_LOG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Start disposable SurrealDB
        uses: surrealdb/setup-surreal@v2
        with:
          # Match the production engine used for the accepted candidate.
          surrealdb_version: v3.2.3
          surrealdb_port: 8000
          surrealdb_username: root
          surrealdb_password: root
          surrealdb_auth: true
          surrealdb_log: warn
          surrealdb_retry_count: 30

      - name: Compile db-integration targets
        run: cargo check --workspace --all-targets --features db_integration --locked

      - name: Run protocol regressions
        timeout-minutes: 10
        run: |
          cargo test --locked --features db_integration \
            --test mcp_protocol -- \
            --skip test_call_tool_continuity_fallback_protocol \
            --nocapture --test-threads=1

      - name: Run stdio smoke
        timeout-minutes: 10
        run: |
          cargo test --locked --features db_integration \
            --test stdio_smoke stdio01_initialize_and_list_tools_smoke -- \
            --exact --nocapture --test-threads=1

      - name: Run GROUP ALL count regression
        timeout-minutes: 10
        run: |
          cargo test --locked --features db_integration \
            --test dimension_hygiene test_group_all_required_for_accurate_count -- \
            --exact --nocapture --test-threads=1

      - name: Run schema dimension and bypass regression
        timeout-minutes: 10
        run: |
          cargo test --locked --features db_integration \
            --test dimension_hygiene \
            test_schema_dimension_mismatch_requires_or_honors_emergency_bypass -- \
            --exact --nocapture --test-threads=1

      - name: Run agent job status database regressions
        timeout-minutes: 10
        run: |
          cargo test --locked --features db_integration \
            --test test_agent_job_status -- \
            --nocapture --test-threads=1
